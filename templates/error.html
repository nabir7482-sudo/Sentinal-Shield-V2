{% extends "base.html" %}
{% block title %}{{ code }} · SentinelShield{% endblock %}
{% block content %}
<section class="error-wrap">
  <div class="error-code">{{ code }}</div>
  <p class="eyebrow">SENTINELSHIELD SECURITY RESPONSE</p>
  <h1>{{ title }}</h1>
  <p class="muted">{{ message }}</p>
  {% if admin_username %}<a class="btn btn-primary mt-3" href="{{ url_for('dashboard.index') }}">Return to dashboard</a>{% else %}<a class="btn btn-primary mt-3" href="{{ url_for('auth.login') }}">Return to sign in</a>{% endif %}
</section>
{% endblock %}
